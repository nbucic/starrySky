esphome:
  on_boot:
    - then:
      - globals.set:
          id: sound_generator_initial_volume
          value: '25.0'
      - number.set:
          id: sound_generator_volume
          value: !lambda "return id(sound_generator_initial_volume);"
      - logger.log:
          format: "The initial volume is %d."
          args: [ 'id(sound_generator_initial_volume)' ]

globals:
  - id: sound_generator_initial_volume
    type: float
    restore_value: false
    initial_value: '25'

uart:
  baud_rate: 9600
  rx_pin: ${rx_pin}
  tx_pin: ${tx_pin}

dfplayer:
  on_finished_playback:
    then:
      - logger.log: 'Playback finished event'
      - select.set_index:
          id: sound_generator_choose_sound
          index: 0

select:
  - platform: template
    name: Select Sound
    id: sound_generator_choose_sound
    optimistic: true
    options:
      - "Choose soundscape"
      - "Winter Wind Storm in a Mountain Forest"
      - "Fire Cracking"
      - "Light Jungle Rain"
      - "North Sea Waves"
      - "Thunder and rain"
      - "Pjesma 6"
    on_value:
      - then:
          - if:
              condition:
                - lambda: 'return i > 0;'
              then:
                - dfplayer.play_mp3: !lambda 'return i;'
          - if:
              condition:
                - lambda: 'return i == 0;'
              then:
                - dfplayer.stop

button:
  - platform: template
    name: Volume down
    id: sound_generator_volume_down
    on_press:
      - number.decrement:
          id: sound_generator_volume
          cycle: false
  - platform: template
    name: Volume up
    id: sound_generator_volume_up
    on_press:
      - number.increment:
          id: sound_generator_volume
          cycle: false

number:
  - platform: template
    name: Volume
    id: sound_generator_volume
    min_value: 0
    max_value: 30
    step: 1
    optimistic: true
    on_value:
      then:
        - dfplayer.set_volume: !lambda 'return x;'

binary_sensor:
  - platform: gpio
    id: dfplayer_work
    name: Sleeping Master playing
    pin:
      number: ${busy_pin}
      inverted: true
    on_state:
      then:
        - logger.log:
            format: "Current state is %s"
            args: [ 'x' ]
