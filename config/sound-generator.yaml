esphome:
  on_boot:
    - then:
        - number.set:
            id: sound_generator_volume
            value: !lambda "return id(sound_generator_initial_volume);"

globals:
  - id: sound_generator_initial_volume
    type: float
    restore_value: false
    initial_value: '25'
  - id: sound_generator_initial_volume_per_song
    type: float[7]
    restore_value: false
    initial_value: '{0, 25, 23, 25, 25, 25, 25}'

uart:
  baud_rate: 9600
  rx_pin: ${rx_pin}
  tx_pin: ${tx_pin}
#  debug:

dfplayer:
  on_finished_playback:
    then:
      - select.set_index:
          id: sound_generator_choose_sound
          index: 0

select:
  - platform: template
    name: Select Sound
    id: sound_generator_choose_sound
    optimistic: true
    options:
      - "Choose soundscape"
      - "Winter Wind Storm in a Mountain Forest"
      - "Fire Cracking"
      - "Light Jungle Rain"
      - "North Sea Waves"
      - "Thunder and rain"
      - "TEST - makni uskoro"
    initial_option: "Choose soundscape"
    on_value:
      - then:
          - if:
              condition:
                - lambda: 'return (id(sound_generator_choose_sound).active_index() == 0);'
              then:
                - number.set:
                    id: sound_generator_volume
                    value: !lambda 'return id(sound_generator_initial_volume_per_song)[i];'
                - delay: 2s
                - dfplayer.stop
          - if:
              condition:
                - lambda: 'return (id(sound_generator_choose_sound).active_index() > 0);'
              then:
                - number.set:
                    id: sound_generator_volume
                    value: !lambda 'return id(sound_generator_initial_volume_per_song)[i];'
                - delay: 2s
                - dfplayer.play_mp3: !lambda 'return i;'

number:
  - platform: template
    name: Volume
    id: sound_generator_volume
    min_value: 0
    max_value: 30
    step: 1
    optimistic: true
    on_value:
      then:
        - dfplayer.set_volume: !lambda 'return x;'

binary_sensor:
  - platform: gpio
    id: dfplayer_work
    name: Sleeping Master playing
    pin:
      number: ${busy_pin}
      mode: INPUT_PULLUP
      inverted: true
  - platform: status
    name: "Sound machine status"
