# Shared by every device. Each device sets `name` and `friendly_name` in its
# own `<device>/config.yaml`, which the device YAML includes before this file.
packages:
  wifi: !include wifi_networks.yaml

esp32:
  framework:
    type: arduino

# Defaults; a device's config.yaml can override them.
substitutions:
  ap_ssid: SSC
  ap_password: ssc12345

wifi:
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"

captive_portal:

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

logger:

sensor:
  - platform: wifi_signal # Reports the Wi-Fi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the Wi-Fi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

api:
  encryption:
    key: !secret api_encryption_key

# A bare `encryption:` block reuses the api encryption key above.
ota:
  - platform: esphome
    encryption:
