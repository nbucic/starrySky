packages:
  config: !include base_config.yaml
  sound_generator: !include sound-generator.yaml

substitutions:
  tx_pin: GPIO17
  rx_pin: GPIO16
  busy_pin: GPIO18
  ap_ssid: sounder
  ap_pwd: sounder1234

esp32:
  board: esp32dev

esphome:
  name: sleepy-master
  friendly_name: Sleeping Master

api:
  encryption:
    key: C25ZJlQnM90iA+0JmcwQZqgbaPK8cRO5yEe0MVTAEWM=
  actions:
    - action: sounder_play_mp3
      variables:
        file: int
      then:
        - dfplayer.play_mp3: !lambda 'return file;'
    - action: sounder_play
      variables:
        file: int
      then:
        - dfplayer.play: !lambda 'return file;'

wifi:

logger:

