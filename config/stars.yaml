globals:
  - id: stars_red_value
    type: float
    restore_value: False
    initial_value: "0.0"
  - id: stars_green_value
    type: float
    restore_value: False
    initial_value: "0.0"
  - id: stars_blue_value
    type: float
    restore_value: False
    initial_value: "0.0"
  - id: stars_white_value
    type: float
    restore_value: False
    initial_value: "1.0"
  - id: stars_motor_speed
    type: int
    restore_value: False
    initial_value: "0"
  - id: stars_effect
    type: int
    restore_value: false
    initial_value: "-1"


substitutions:
  mac_address: 21:0A:00:06:8E:E5
  #mac_address: 21:0A:00:06:86:9F

ble_client:
  - mac_address: ${mac_address}
    id: stars_ble_client
    on_connect:
      then:
        - binary_sensor.template.publish:
            id: stars_connected_sensor
            state: ON
        - switch.turn_off: stars_on_off_switch

    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: stars_connected_sensor
            state: OFF

switch:
  - platform: ble_client
    ble_client_id: stars_ble_client
    name: "Bluetooth enabled"
    internal: true
  - platform: template
    id: stars_on_off_switch
    name: "Led turned on"
    internal: true
    restore_mode: ALWAYS_OFF
    turn_off_action:
      - ble_client.ble_write:
          id: stars_ble_client
          service_uuid: 0000ffb0-0000-1000-8000-00805f9b34fb
          characteristic_uuid: 0000ffb1-0000-1000-8000-00805f9b34fb
          value: !lambda return StarrySky::turnOff();

light:
  - platform: rgbw
    id: stars_rgb_led
    name: Stars
    color_interlock: true
    red: red_channel_output
    green: green_channel_output
    blue: blue_channel_output
    white: white_channel_output
    default_transition_length: 1s
    on_turn_on:
      - lambda: "return id(stars_on_off_switch).turn_on();"
    on_turn_off:
      - lambda: "return id(stars_on_off_switch).turn_off();"

output:
  - platform: template
    id: red_channel_output
    type: float
    min_power: 0.003
    zero_means_zero: true
    write_action:
      - lambda: "id(stars_red_value) = state;"
  - platform: template
    id: green_channel_output
    type: float
    min_power: 0.003
    zero_means_zero: true
    write_action:
      - lambda: "id(stars_green_value) = state;"
  - platform: template
    id: blue_channel_output
    type: float
    min_power: 0.003
    zero_means_zero: true
    write_action:
      - lambda: "id(stars_blue_value) = state;"
  - platform: template
    id: white_channel_output
    type: float
    min_power: 0.003
    zero_means_zero: true
    write_action:
      - lambda: "id(stars_white_value) = state;"
      - ble_client.ble_write:
          id: stars_ble_client
          service_uuid: 0000ffb0-0000-1000-8000-00805f9b34fb
          characteristic_uuid: 0000ffb1-0000-1000-8000-00805f9b34fb
          value: !lambda |-
            int motorOnOff = id(stars_motor_speed) > 0 ? 1 : 0;
            return StarrySky::turnOn(StarrySky::FunctionType::LIGHT, -1, id(stars_red_value), id(stars_green_value), id(stars_blue_value), id(stars_white_value), motorOnOff, id(stars_motor_speed));

number:
  - platform: template
    min_value: 0
    max_value: 4
    name: Stars Speed
    id: stars_speed
    step: 1
    optimistic: true
    on_value:
      then:
        - ble_client.ble_write:
            id: stars_ble_client
            service_uuid: 0000ffb0-0000-1000-8000-00805f9b34fb
            characteristic_uuid: 0000ffb1-0000-1000-8000-00805f9b34fb
            value: !lambda |-
              id(stars_motor_speed) = x;
              int motorOnOff = id(stars_motor_speed) > 0 ? 1 : 0;
              return StarrySky::turnOn(StarrySky::FunctionType::LIGHT, -1, id(stars_red_value), id(stars_green_value), id(stars_blue_value), id(stars_white_value), motorOnOff, id(stars_motor_speed));

binary_sensor:
  - platform: template
    name: "Stars connected"
    id: stars_connected_sensor
